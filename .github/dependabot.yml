version: 2
updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore"
  open-pull-requests-limit: 1
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "monthly"
  commit-message:
    prefix: "chore"
  groups:
    actions:
      patterns:
        - "*"
  open-pull-requests-limit: 1
  ignore:
  - dependency-name: "*"
    update-types:
    - "version-update:semver-major"
