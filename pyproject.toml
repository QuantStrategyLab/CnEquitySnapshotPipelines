[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-equity-snapshot-pipelines"
version = "0.1.0"
description = "Feature-snapshot pipelines and scaffold helpers for A-share equity strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "cn-equity-strategies @ git+https://github.com/QuantStrategyLab/CnEquityStrategies.git@df32d12bace88ee414d9c586847f87e5b56ebe93",
  "quant-platform-kit @ git+https://github.com/QuantStrategyLab/QuantPlatformKit.git@1a6ed98eea5d69ebe6d09ec1cb1e6ec10c4faeed",
]

[project.optional-dependencies]
test = ["pytest>=8"]
public-data = ["akshare>=1.14", "requests>=2.31"]

[project.scripts]
cneq-build-dividend-quality-snapshot = "cn_equity_snapshot_pipelines.dividend_quality:main"
cneq-build-chinext-growth-momentum-quality-snapshot = "cn_equity_snapshot_pipelines.chinext_growth_momentum_quality:main"
cneq-stage-akshare-dividend-quality = "cn_equity_snapshot_pipelines.akshare_staging:main"
cneq-stage-akshare-market-history = "cn_equity_snapshot_pipelines.akshare_market_history:main"
cneq-publish-research-input = "cn_equity_snapshot_pipelines.research_input_publish:main"
cneq-publish-index-etf-input = "cn_equity_snapshot_pipelines.index_etf_input_publish:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
